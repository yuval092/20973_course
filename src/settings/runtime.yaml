board_center: [1.18, 0.75, 0.4] # Physical XYZ center of the 8x8 chessboard in the MuJoCo world.
square_size: 0.07 # Width and height of a single square on the board in meters.
table_height: 0.4 # The Z-coordinate of the tabletop surface.
z_grasp: 0.413 # Target height for the gripper center when picking up or placing a piece.
z_safe: 0.56 # Default minimum height for safe horizontal transit across the board.

n_substeps: 20 # Number of MuJoCo simulation steps executed for every one controller action.
action_scale: 0.05 # Multiplier applied to controller outputs to determine physical displacement per step.
goal_tolerance: 0.05 # Distance threshold used to determine if a waypoint or target has been reached.
placement_tolerance: 0.025 # Maximum allowed vertical deviation from the target when releasing a piece.
max_steps_per_phase: 250 # Safety timeout for the maximum steps allowed for any single movement stage.
fetch_policy_horizon: 50 # Maximum number of steps the RL policy is permitted to run for a sub-task.
settle_steps: 50 # Number of steps to wait for physics to stabilize after an action completes.
retract_steps: 25 # Number of steps dedicated to moving the arm away after a piece is released.
gripper_actuation_steps: 12 # Duration in simulation steps for the gripper to fully open or close.
grip_contact_tolerance: 0.025 # Distance threshold between fingers and piece to confirm a successful grasp.
piece_follow_tolerance: 0.06 # Max allowed distance between piece and gripper during lifting to verify attachment.
piece_drift_tolerance: 0.01 # Max horizontal movement allowed for a piece after placement to consider it stable.
release_settle_steps: 25 # Wait time after opening the gripper before the arm moves away.
release_velocity_tolerance: 0.01 # Maximum velocity a piece can have to be considered "settled" after release.
release_gripper_open_tolerance: 0.004 # Precision required for the gripper state to be considered fully "open."
release_clearance_margin: 0.08 # Extra vertical lift applied immediately after release to avoid collisions.
final_settle_steps: 120 # Extended wait period at the end of a turn for all physical motion to cease.
pregrasp_gripper_opening: 0.025 # The width the gripper opens to before descending onto a piece.
grasp_descend_offset: 0.015 # Vertical distance above the piece where the final descent stage begins.
close_descend_offset: 0.002 # Tiny vertical adjustment applied during gripping to ensure firm table contact.
close_descend_steps: 50 # Steps allowed for the micro-descent while the gripper is closing.
workspace_xy_margin: 0.12 # Buffer zone around the board used for validating robot workspace safety.
workspace_z_min: 0.42 # Minimum allowed Z-height for any robot arm movement.
workspace_z_max: 0.9 # Maximum allowed Z-height for any robot arm movement.
viewer_step_delay_sec: 0 # Artificial delay between frames used to slow down the visualization for debugging.
reachable_x_min: 0.9 # Minimum X-coordinate the arm can physically reach.
reachable_x_max: 1.48 # Maximum X-coordinate the arm can physically reach.
reachable_y_min: 0.28 # Minimum Y-coordinate the arm can physically reach.
reachable_y_max: 1.18 # Maximum Y-coordinate the arm can physically reach.
reachable_z_min: 0.4 # Minimum Z-coordinate the arm can physically reach.
reachable_z_max: 0.82 # Maximum Z-coordinate the arm can physically reach.
fetch_init_grip: [1.3419, 0.7491, 0.575] # The "home" or starting XYZ coordinate for the robot gripper.
policy_xy_radius: 0.50 # Horizontal distance from the policy center where the RL model is considered reliable.
policy_z_min: 0.41 # Minimum vertical range the RL policy was trained to operate within.
policy_z_max: 0.75 # Maximum vertical range the RL policy was trained to operate within.

gripper_open: 0.05 # Control value sent to actuators for the fully open state.
gripper_closed: 0.0 # Control value sent to actuators for the fully closed state.

l_finger_actuator: robot0:l_gripper_finger_joint # MuJoCo joint name for the left gripper finger.
r_finger_actuator: robot0:r_gripper_finger_joint # MuJoCo joint name for the right gripper finger.
grip_site: robot0:grip # MuJoCo site name representing the center point of the gripper.

white_graveyard_origin: [0.93, 0.30, 0.425] # Starting XYZ coordinate for white captured piece tray.
black_graveyard_origin: [1.15, 0.30, 0.425] # Starting XYZ coordinate for black captured piece tray.
graveyard_spacing: 0.05 # Distance between pieces in the graveyard grid layout.
graveyard_cols: 4 # Number of columns used to arrange captured pieces in the graveyard.
graveyard_platform_half_extents: [0.10, 0.09, 0.012] # Half-width/depth/height of the physical graveyard tray geoms.
graveyard_platform_height: 0.024 # The total thickness of the graveyard platform geom.

stockfish_paths: [/usr/games/stockfish, /usr/local/bin/stockfish, stockfish] # List of filesystem paths to search for the Stockfish executable.
stockfish_time_limit: 0.1 # Time in seconds the AI is allowed to think before returning a move.

hf_repo_id: IntelliGrow/FetchPickAndPlace-v4 # The repository ID containing the pretrained RL policy.
hf_filename: sac-FetchPickAndPlace-v4.zip # The specific ZIP file name of the model weights in the repository.

local_model_path: "sac-FetchPickAndPlace-v4.zip" # Fallback local ZIP file name.

# Robot slide offsets (controls base position)
robot_slide_x: 0.30 # Move robot back to avoid touching the board base
robot_slide_y: 0.48
robot_slide_z: 0.0

tilt_threshold_cos: 0.966 # Cosine of the maximum tilt angle allowed before a piece is considered "fallen."
displacement_threshold: 0.4 # Maximum horizontal distance a piece can drift from its square center.

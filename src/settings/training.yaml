repo_id: sb3/tqc-FetchPickAndPlace-v1
checkpoint_filename: tqc-FetchPickAndPlace-v1.zip
rollout_horizon: 50
eval_games: 25
deterministic_eval: true
curriculum:
  - name: center_opening
    description: Central-board placements without captures.
    max_source_rank_span: 4
    include_captures: false
    include_clutter: false
  - name: full_board_no_capture
    description: Full board placements without capture episodes.
    max_source_rank_span: 8
    include_captures: false
    include_clutter: false
  - name: full_board_capture
    description: Full board with capture tasks and clutter enabled.
    max_source_rank_span: 8
    include_captures: true
    include_clutter: true

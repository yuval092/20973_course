cube_height: 0.030
cube_z: 0.415
grasp_z: 0.425              # 6.5mm table clearance; grip site 5mm below cube top (78% overlap)
safe_z: 0.550
success_threshold: 0.010
success_bonus: 500.0
drift_limit_start: 0.100
drift_limit_end: 0.010
floor_limit: 0.400
crash_penalty: -500.0
hidden_object_pos: [2.0, 2.0, 0.015]
table_surface_z: 0.400
table_center_xy: [0.88, 0.2641]
table_half_x: 0.28
table_half_y: 0.28
edge_margin: 0.04
min_goal_dist: 0.10

# Home Position (new)
home_position_xy: [0.680, 0.2641]   # within transit training range [0.640, 1.120]; NOT 0.600 (outside range)

# Grasp Phase Thresholds (new)
grasp_contact_approach_tolerance: 0.001   # 1mm fine-descent tolerance
grasp_close_steps: 150                    # Steps for actuator-driven finger close
grasp_hold_steps: 50                      # Hold steps after close to let physics settle
grasp_verify_xy_threshold: 0.015          # 15mm — max cube-to-grip XY error to verify hold
grasp_verify_z_threshold: 0.020           # 20mm — max cube-to-grip Z error to verify hold
grasp_verify_finger_threshold: 0.016      # finger stalls at j≈0.0141 for 30mm cube; threshold ABOVE stall (was 0.012)

# Cube Hold Monitoring (new)
cube_held_xy_limit: 0.030                 # 30mm — if cube exceeds this from grip, it's dropped
cube_held_z_limit: 0.020                  # 20mm — tighter limit: 40mm allows 45mm of ascent before detecting a drop

logging:
  level: "INFO"
  log_dir: "logs/env_debug"

# Task Thresholds
stability_vel_threshold: 0.05  # Max velocity in m/s to consider the arm stable
braking_dist: 0.010             # Distance in meters at which the arm starts braking
floor_proximity_threshold: 0.025 # Safety margin above the floor/table

# Reward Weights & Penalties
z_reward_weight: 1.5           # Multiplier for Z-axis accuracy reward
xy_reward_weight: 2.0          # Multiplier for XY-axis drift penalty
jitter_penalty_weight: 0.003   # Multiplier for penalizing high-frequency actions
floor_penalty: -0.5            # Constant penalty for being too close to the surface

# Reward Weights & Penalties (Continued)
braking_reward_weight: 0.15     # Multiplier for braking reward (velocity reduction near goal)
dist_reward_weight: 1.0        # Multiplier for distance-to-goal reward

# Gripper Constants
max_gripper_width: 0.05        # Maximum opening width of the gripper in meters
eval_drift_limit: 0.010        # Radial limit for drift during evaluation

# Actuator & Geometry Enforcement
finger_open_joint: 0.0181
finger_closed_joint: 0.0000
finger_outer_offset: 0.033

# Logging Settings
sample_debug_freq: 50           # Enable high-fidelity debug logs every N episodes

# Transition Thresholds
halt_vel_threshold: 0.0005     # Max velocity (m/s) to call the arm "stopped" during transition

